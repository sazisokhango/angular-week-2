<app-header />
<main>
  <div id="dashboard">
    <app-dashboard-item
      title="Server Status"
      [imgName]="'status.png'"
      [imgAlt]="'A signal symbol'"
    >
      <app-server-status />
    </app-dashboard-item>
    <app-dashboard-item
      title="Traffic"
      [imgName]="'globe.png'"
      [imgAlt]="'A globe'"
    >
      <app-traffic />

    <app-dashboard-item
      title="Support Ticket"
      [imgName]="'list.png'"
      [imgAlt]="'A list of items'"
    >
      <app-tickets />
    </app-dashboard-item>
  </div>
</main>
